# Name of your application. Used to uniquely configure containers.
service: ghrian-server

# Name of the container image — the one published to Docker Hub.
image: felipezavan/ghrian-server

# Deploy to these servers. The MQTT listener is its own long-running process
# (a blocking subscribe loop — it can't share Puma like Solid Queue does), so it
# runs as a second role with the same image.
servers:
  web:
    - your-server-ip   # e.g. 203.0.113.10
  listener:
    hosts:
      - your-server-ip
    cmd: bin/mqtt-listener

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# proxy:
#   ssl: true
#   host: app.example.com

# Where you keep your container images.
registry:
  # Docker Hub (where the CI workflow publishes). Alternatives: ghcr.io / ...
  server: docker.io
  username: felipezavan

  # A Docker Hub access token (not your real password). Resolved from the env at
  # deploy time via .kamal/secrets. Kamal logs in on the server to pull the image.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# The image carries no master.key (see .dockerignore); it reads its secrets from
# the environment, exactly like compose.yml. Generate each with `openssl rand`
# (see .env.example) and export them before deploying.
env:
  secret:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Seed the MQTT connection on first boot so the listener connects with no UI
    # step (only applied when the config row is first created). The broker accessory
    # is reachable by its container name on the kamal docker network.
    MQTT_HOST: ghrian-server-broker
    MQTT_BASE_TOPIC: ghrian

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use server-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "server_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.3
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# The MQTT broker the stack speaks over. The agent (at home) publishes here and
# the listener subscribes. Accessories share the `kamal` docker network with the
# app containers, so web/listener reach it at host `ghrian-server-broker`.
#
# `port` below binds to loopback by default — override it per host (e.g. to a
# Tailscale/VPN IP) so home consumers can reach it without exposing 1883 publicly.
accessories:
  broker:
    image: eclipse-mosquitto:2
    host: your-server-ip
    port: "127.0.0.1:1883:1883"
    files:
      - config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    directories:
      - broker-data:/mosquitto/data
