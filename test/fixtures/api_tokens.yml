# Only the digest is stored; tests build Bearer headers from the plaintext values
# in ActiveSupport::TestCase::RAW_API_TOKENS (see test_helper.rb).
macos:
  user: one
  name: macOS app
  token_digest: <%= Digest::SHA256.hexdigest("ghr_test_macos_0001") %>
  token_prefix: ghr_test_mac
  last_used_at: <%= 2.hours.ago.to_fs(:db) %>

cli:
  user: two
  name: CLI
  token_digest: <%= Digest::SHA256.hexdigest("ghr_test_cli_0002") %>
  token_prefix: ghr_test_cli
